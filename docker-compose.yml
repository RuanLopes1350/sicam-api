name: sicam

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: sicam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-sicam}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-sicam}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sicam-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ADR-09: Bucket S3 auto-hospedado 100% privado (SeaweedFS S3 Gateway sem identidade anônima)
  s3:
    image: chrislusf/seaweedfs:latest
    container_name: sicam-s3
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=9000", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "${S3_PORT:-9000}:9000"
    volumes:
      - s3_data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Serviços opcionais da aplicação containerizada (`docker compose --profile full up -d --build`)
  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: sicam-migrator
    profiles: ["app", "full"]
    restart: "no"
    command: ["node", "dist/config/db/migrate.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_MIGRATOR_URL: postgresql://app_migrator:${APP_MIGRATOR_PASSWORD:-migrator_dev_secret}@postgres:5432/${POSTGRES_DB:-sicam}
      DATABASE_URL: postgresql://app_runtime:${APP_RUNTIME_PASSWORD:-runtime_dev_secret}@postgres:5432/${POSTGRES_DB:-sicam}
      JWT_ED25519_PRIVATE_KEY_B64: ${JWT_ED25519_PRIVATE_KEY_B64:-}
      JWT_ED25519_PUBLIC_KEY_B64: ${JWT_ED25519_PUBLIC_KEY_B64:-}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: sicam-api
    profiles: ["app", "full"]
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: ${PORT:-3333}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_PROBLEM_BASE_URI: ${API_PROBLEM_BASE_URI:-https://api.sicam.local/problems}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      ENABLE_OPENAPI_ROUTE: ${ENABLE_OPENAPI_ROUTE:-true}
      DATABASE_URL: postgresql://app_runtime:${APP_RUNTIME_PASSWORD:-runtime_dev_secret}@postgres:5432/${POSTGRES_DB:-sicam}
      DATABASE_MIGRATOR_URL: postgresql://app_migrator:${APP_MIGRATOR_PASSWORD:-migrator_dev_secret}@postgres:5432/${POSTGRES_DB:-sicam}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://s3:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-sicam_s3_admin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-sicam_s3_dev_secret_key}
      S3_BUCKET: ${S3_BUCKET:-sicam-artifacts}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      JWT_ED25519_PRIVATE_KEY_B64: ${JWT_ED25519_PRIVATE_KEY_B64:-}
      JWT_ED25519_PUBLIC_KEY_B64: ${JWT_ED25519_PUBLIC_KEY_B64:-}
      JWT_ISSUER: ${JWT_ISSUER:-sicam-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-sicam-web}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MIN_AOI_AREA_HA: ${MIN_AOI_AREA_HA:-0.5}
      MAX_AOI_AREA_HA: ${MAX_AOI_AREA_HA:-50000}
      MAX_AOI_VERTICES: ${MAX_AOI_VERTICES:-500}
      MAX_ACTIVE_RUNS_PER_USER: ${MAX_ACTIVE_RUNS_PER_USER:-2}
      ENFORCE_IMPORTED_UF_COVERAGE: ${ENFORCE_IMPORTED_UF_COVERAGE:-true}
      GEO_MAX_PIXELS_GUARD: ${GEO_MAX_PIXELS_GUARD:-8000000}
      ENGINE_VERSION: ${ENGINE_VERSION:-1.0.0}
    ports:
      - "${PORT:-3333}:3333"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: sicam-worker
    profiles: ["app", "full"]
    restart: unless-stopped
    shm_size: "512mb"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://app_runtime:${APP_RUNTIME_PASSWORD:-runtime_dev_secret}@postgres:5432/${POSTGRES_DB:-sicam}
      DATABASE_MIGRATOR_URL: postgresql://app_migrator:${APP_MIGRATOR_PASSWORD:-migrator_dev_secret}@postgres:5432/${POSTGRES_DB:-sicam}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://s3:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-sicam_s3_admin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-sicam_s3_dev_secret_key}
      S3_BUCKET: ${S3_BUCKET:-sicam-artifacts}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      JWT_ED25519_PRIVATE_KEY_B64: ${JWT_ED25519_PRIVATE_KEY_B64:-}
      JWT_ED25519_PUBLIC_KEY_B64: ${JWT_ED25519_PUBLIC_KEY_B64:-}
      MIN_AOI_AREA_HA: ${MIN_AOI_AREA_HA:-0.5}
      MAX_AOI_AREA_HA: ${MAX_AOI_AREA_HA:-50000}
      MAX_AOI_VERTICES: ${MAX_AOI_VERTICES:-500}
      MAX_ACTIVE_RUNS_PER_USER: ${MAX_ACTIVE_RUNS_PER_USER:-2}
      ENFORCE_IMPORTED_UF_COVERAGE: ${ENFORCE_IMPORTED_UF_COVERAGE:-true}
      GEO_MAX_PIXELS_GUARD: ${GEO_MAX_PIXELS_GUARD:-8000000}
      ENGINE_VERSION: ${ENGINE_VERSION:-1.0.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  traefik:
    image: traefik:v3.2
    container_name: sicam-traefik
    profiles: ["edge"]
    restart: unless-stopped
    command:
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=false"
    ports:
      - "8080:80"
    volumes:
      - ./infra/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  redis_data:
  s3_data:
